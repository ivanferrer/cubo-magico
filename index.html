<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cubo Mágico 4x4</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #111;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        
        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #win-overlay img {
            max-width: 80%;
            max-height: 70vh;
            margin-bottom: 20px;
        }
        #win-overlay h2 { margin: 0; font-size: 24px; }
        #close-win {
            margin-top: 20px;
            background: #ff4757;
            color: white;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            width: fit-content;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="instructions">Arraste as faces até completar<br> 3 quadradinhos para girar uma face do cubo.<br>Arraste o fundo para orbitar</div>
    <div id="ui">
        <button id="undo-btn">Desfazer</button>
        <button id="scramble-btn">Embaralhar</button>
        <button id="reset-btn">Resetar</button>
    </div>

    <div id="win-overlay">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; max-width: 90%;">
            <img src="win_cat.png" alt="Parabéns!">
            <div id="win-message" style="
                background: rgba(255, 255, 255, 0.95);
                color: #333;
                padding: 20px;
                border-radius: 15px;
                margin-top: 10px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                border: 4px solid #feca57;
                font-size: 20px;
                font-weight: bold;
                line-height: 1.4;
                z-index: 101;
            ">
                Parabéns! Espero que tenha gostado, porque foi divertido ver você montando o cubo mágico!
            </div>
        </div>
        <button id="close-win">Fechar</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
